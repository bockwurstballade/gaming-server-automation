# Test SSH connectivity before running the playbook:
# cd ~/ansible
# ansible -i inventory/inventory.yml -k -u root all -m ping
# Enter SSH root password...
# Execute the playbook:
# cd ~/ansible
#  ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i inventory/inventory.yml -u root --ask-vault-pass operations/os/ssh/upload_key.yml
- hosts: all
  vars_files:
  # relative paths (e. g. ./secrets/secrets.yml) must be specified from the perspective of this file upload_key.yml.
    - ../../../secrets/secrets.yml  # Explicitly include the vault file
  vars:
    ansible_ssh_pass: "{{ root_os_password }}"
    ansible_become_pass: "{{ dafrk__local_password }}"
  roles:
    - roles/os/ssh/key_uploaded
